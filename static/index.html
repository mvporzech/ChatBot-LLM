<!doctype html>
<html lang="pl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat zespołu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 16px;
      background: #f4f4f4
    }

    main {
      background: #fff;
      padding: 24px;
      border-radius: 12px
    }

    #chat {
      min-height: 260px;
      border: 1px solid #ddd;
      padding: 12px;
      margin-bottom: 12px
    }

    .user {
      color: #174ea6;
      margin: 12px 0
    }

    .bot {
      color: #176b38;
      margin: 12px 0
    }

    form {
      display: flex;
      gap: 8px
    }

    input {
      flex: 1;
      padding: 12px
    }

    button {
      padding: 12px 18px;
      cursor: pointer
    }
  </style>
</head>

<body>
  <main>
    <h1>Chat zespołu</h1>
    <div id="chat">
      <p class="bot">Napisz pytanie o zespół.</p>
    </div>
    <form id="form">
      <input id="question" placeholder="Np. Kto zajmuje się analityką?" required>
      <button>Wyślij</button>
    </form>
  </main>
  <script>
    const form = document.querySelector("#form"), input = document.querySelector("#question"), chat = document.querySelector("#chat");
    form.addEventListener("submit", async event => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question) return;
      chat.insertAdjacentHTML("beforeend", `<p class="user"><b>Ty:</b> ${question}</p>`);
      input.value = "";
      try {
        const response = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question }) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "Błąd");
        chat.insertAdjacentHTML("beforeend", `<p class="bot"><b>Bot:</b> ${data.answer}</p>`);
      } catch (error) { chat.insertAdjacentHTML("beforeend", `<p class="bot"><b>Błąd:</b> ${error.message}</p>`); }
      chat.scrollTop = chat.scrollHeight;
    });
  </script>
</body>

</html>
